<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti ❤️</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #ffe6ef;
      color: #7a2145;
      padding: 30px 15px;
    }

    h1 {
      font-size: 32px;
    }

    p {
      font-size: 18px;
    }

    .fotos {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 25px;
    }

    .fotos img {
      width: 150px;
      height: 180px;
      object-fit: cover;
      border-radius: 15px;
      box-shadow: 0 4px 10px #999;
    }

    .corazon {
      font-size: 45px;
    }
  </style>
</head>

<body>

  <div class="corazon">❤️</div>

  <h1>Para ti, mi amor</h1>

  <p>
    Quería hacerte algo especial para recordarte
    lo mucho que significas para mí. ❤️
  </p>

  <div class="fotos">
    <img src="foto 01.jpg.jpeg">
    <img src="foto 02.jpg.jpeg">
    <img src="foto 03.jpg.jpeg">
  </div>

</body>
</html>
